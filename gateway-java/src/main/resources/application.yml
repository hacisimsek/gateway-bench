spring:
  application:
    name: gateway-java
  threads:
    virtual:
      # Every request runs on its own virtual thread instead of a pooled platform thread.
      enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}
      # Past this, Redis counts as down and the request goes through unlimited (fail open).
      timeout: 100ms
      connect-timeout: 100ms
  cloud:
    gateway:
      server:
        webmvc:
          # Default routes for Docker Compose. In Kubernetes a ConfigMap overrides them.
          routes:
            - id: users
              uri: http://upstream:9000
              predicates:
                - Path=/users/**

gateway:
  jwt:
    # RS256 public key, mounted from a Secret/ConfigMap in Kubernetes.
    public-key-location: file:${JWT_PUBLIC_KEY_FILE:/etc/gateway/jwt/public.pem}
    # Must equal the token's "iss" claim.
    issuer: ${JWT_ISSUER:gateway-bench}
  rate-limit:
    # One token bucket per JWT subject, shared with gateway-rust through Redis.
    per-second: ${RATE_LIMIT_PER_SECOND:10}
    burst: ${RATE_LIMIT_BURST:20}
    # Same Lua file as gateway-rust (ratelimit/token_bucket.lua in the repo).
    script-location: file:${RATE_LIMIT_SCRIPT_FILE:/etc/gateway/ratelimit/token_bucket.lua}

server:
  port: 8080
  shutdown: graceful

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema), with trace and span ids.
      console: ecs

management:
  server:
    # Probes and metrics on their own port, never exposed through the Ingress.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # Same buckets as gateway-rust's http_server_requests_seconds, for one shared Grafana query.
      slo:
        http.server.requests: 1ms,2500us,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus, not pushed over OTLP.
        enabled: false
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
      probes:
        enabled: true
