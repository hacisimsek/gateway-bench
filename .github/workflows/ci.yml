# Every push and PR: unit tests + both gateways side by side on the full stack (parity tests).
# Push to main: build each image natively on amd64 and arm64, push one multi-arch tag to GHCR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository }} # ghcr.io/hacisimsek/gateway-bench/<service>

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same command as on a laptop: Rust and Java builds run inside Docker.
      - run: make test

  parity:
    name: Parity tests (full stack)
    runs-on: ubuntu-24.04
    env:
      OTEL_TRACES_SAMPLER_ARG: "0" # no Jaeger in CI, so sample nothing
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images (reuses the publish job's layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          targets: upstream,gateway-rust,gateway-java
          load: true
          set: |
            upstream.tags=gateway-bench-upstream
            gateway-rust.tags=gateway-bench-gateway-rust
            gateway-java.tags=gateway-bench-gateway-java
            upstream.cache-from=type=gha,scope=upstream-amd64
            gateway-rust.cache-from=type=gha,scope=gateway-rust-amd64
            gateway-java.cache-from=type=gha,scope=gateway-java-amd64
      - run: make keys
      - run: docker compose up -d --no-build gateway-rust gateway-java
      - name: Wait for both gateways
        run: for _ in $(seq 60); do make -s smoke >/dev/null 2>&1 && exit 0; sleep 2; done; make smoke
      - run: make smoke-auth
      - run: make smoke-ratelimit
      - run: make smoke-shutdown
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color upstream redis gateway-rust gateway-java

  images:
    name: Image ${{ matrix.service }} (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [unit, parity]
    # Native runners per architecture: no QEMU, and the Java AOT cache is trained on the CPU it runs on.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [upstream, gateway-rust, gateway-java]
        arch: [amd64, arm64]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:${{ matrix.service }}"
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }}
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [upstream, gateway-rust, gateway-java]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.service }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          # sha-<short commit> is what the deploy config will pin; main always moves.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - name: One tag, two architectures
        working-directory: ${{ runner.temp }}/digests
        # Word splitting is intended: one -t per tag, one argument per digest.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.service }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ matrix.service }}:main
