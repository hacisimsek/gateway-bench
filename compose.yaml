# Local stack. Both gateways get the same CPU and memory limits so benchmarks are comparable.
services:
  upstream:
    build: ./upstream
    environment:
      SERVICE_NAME: users
    ports: ["9000:9000"]

  gateway-rust:
    build: ./gateway-rust
    ports: ["8081:8080"]
    cpus: 2
    mem_limit: 512m
    depends_on: [upstream]

  gateway-java:
    build: ./gateway-java
    ports: ["8082:8080"]
    cpus: 2
    mem_limit: 512m
    depends_on: [upstream]
