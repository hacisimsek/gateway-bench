# Local stack. Both gateways get the same CPU and memory limits so benchmarks are comparable.
services:
  upstream:
    build: ./upstream
    environment:
      SERVICE_NAME: users
    ports: ["9000:9000"]
    cpus: 4

  gateway-rust:
    build: ./gateway-rust
    ports: ["8081:8080"]
    volumes: ["./.keys/public.pem:/etc/gateway/jwt/public.pem:ro"]
    cpus: 2
    mem_limit: 512m
    depends_on: [upstream]

  gateway-java:
    build: ./gateway-java
    ports: ["8082:8080"]
    volumes: ["./.keys/public.pem:/etc/gateway/jwt/public.pem:ro"]
    environment:
      # JVM flags for experiments, e.g. JAVA_TOOL_OPTIONS="-XX:+UseG1GC" docker compose up -d
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    cpus: 2
    mem_limit: 512m
    depends_on: [upstream]

  # Load generator, only started by bench scripts (docker compose --profile bench run k6 ...).
  k6:
    image: grafana/k6:1.4.2
    profiles: [bench]
    cpus: 4
    volumes: ["./bench:/bench"]
