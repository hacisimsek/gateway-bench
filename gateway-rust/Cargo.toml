[package]
name = "gateway-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde_json = "1"
hyper-util ={ version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
