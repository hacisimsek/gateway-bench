# The cluster's edge: one Gateway API Gateway, implemented by Envoy Gateway.
# Every environment attaches its own HTTPRoutes (deploy/overlays/*/route.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # kind has no load balancer: expose a fixed NodePort that deploy/kind/cluster.yaml maps to localhost:8000.
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports: [{ port: 80, nodePort: 30080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef: { group: gateway.envoyproxy.io, kind: EnvoyProxy, name: kind-nodeport, namespace: envoy-gateway-system }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: All } }
