# One node stands in for three clusters: test, preprod and prod are namespaces.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gateway-bench
nodes:
  - role: control-plane
    extraPortMappings:
      # Envoy Gateway's NodePort (deploy/platform/gateway) -> http://<env-host>.localhost:8000
      - { containerPort: 30080, hostPort: 8000, listenAddress: 127.0.0.1 }
