apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway-preprod
resources:
  - ../../base
  - route.yaml
  - redis-auth.sealed.yaml
configMapGenerator:
  - name: jwt-public-key
    files: [public.pem=jwt-public.pem]
# `make promote FROM=test TO=preprod` opens a PR that copies the tag from test.
images:
  - name: ghcr.io/hacisimsek/gateway-bench/upstream
    newTag: sha-4332495
  - name: ghcr.io/hacisimsek/gateway-bench/gateway-rust
    newTag: sha-4332495
  - name: ghcr.io/hacisimsek/gateway-bench/gateway-java
    newTag: sha-4332495
