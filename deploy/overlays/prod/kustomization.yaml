apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway-prod
resources:
  - ../../base
  - route.yaml
  - redis-auth.sealed.yaml
  - availability.yaml
configMapGenerator:
  - name: jwt-public-key
    files: [public.pem=jwt-public.pem]
# `make promote FROM=preprod TO=prod` opens a PR that copies the tag from preprod.
images:
  - name: ghcr.io/hacisimsek/gateway-bench/upstream
    newTag: sha-4332495
  - name: ghcr.io/hacisimsek/gateway-bench/gateway-rust
    newTag: sha-4332495
  - name: ghcr.io/hacisimsek/gateway-bench/gateway-java
    newTag: sha-4332495
