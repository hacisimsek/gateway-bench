# App of apps: the only thing applied by hand. Argo CD then manages deploy/argocd/apps from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hacisimsek/gateway-bench.git
    targetRevision: main
    path: deploy/argocd/apps
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
