# Cluster add-ons, each pinned. Synced before the environments need them; until then the
# environments retry (their SealedSecrets and HTTPRoutes need these CRDs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    # The chart lives in the project's git repo; its Helm repository is gone.
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: v0.41.2
    path: helm/sealed-secrets
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller # kubeseal's default
        image: { tag: 0.41.2 }
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy # OCI Helm registry, declared in repositories.yaml
    chart: gateway-helm
    targetRevision: v1.10.0
  destination: { server: https://kubernetes.default.svc, namespace: envoy-gateway-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The Gateway API CRDs are too large for client-side apply's annotation.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      valuesObject:
        args: [--kubelet-insecure-tls] # kind's kubelet certificates are self-signed
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hacisimsek/gateway-bench.git
    targetRevision: main
    path: deploy/platform/gateway
  destination: { server: https://kubernetes.default.svc, namespace: envoy-gateway-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 20, backoff: { duration: 10s, factor: 2, maxDuration: 2m } }
